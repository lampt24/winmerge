name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master, 'ui/**' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    
    runs-on: windows-latest

    steps:  
    - name: Configure Git for long paths
      run: git config --global core.longpaths true

    - name: Point relative submodules at the upstream WinMerge organization (needed on forks)
      run: git config --global url."https://github.com/WinMerge/winmerge-manual".insteadOf "https://github.com/${{ github.repository_owner }}/winmerge-manual"

    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Cache
      uses: actions/cache@v5
      with:
        path: Build/WinMergeDownloadDeps
        key: WinMergeDownloadDeps

    - name: Pre-download msys2 packages (mirror.msys2.org often rejects the PowerShell downloads in DownloadDeps.cmd)
      shell: bash
      run: |
        mkdir -p build/WinMergeDownloadDeps
        for u in $(grep -oE 'https://mirror\.msys2\.org/[^!]+' DownloadDeps.cmd); do
          f="build/WinMergeDownloadDeps/$(basename "$u")"
          [ -s "$f" ] && continue
          curl -fsSL --retry 5 --retry-delay 3 -o "$f" "$u" ||
            curl -fsSL --retry 5 --retry-delay 3 -o "$f" "${u/mirror.msys2.org/repo.msys2.org}"
        done
        ls -la build/WinMergeDownloadDeps

    - name: Build
      run: |
        .\DownloadDeps.cmd
        .\BuildAll.cmd x64 -ci

    - name: Upload zip
      uses: actions/upload-artifact@v4
      with:
        name: WinMerge-x64.zip
        path: Build/Releases/*.zip
        if-no-files-found: error

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: WinMerge-x64-Setup-x64.exe
        path: Build/Releases/*.exe
        if-no-files-found: error
