name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master, 'ui/**' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    
    runs-on: windows-latest

    steps:  
    - name: Configure Git for long paths
      run: git config --global core.longpaths true

    - name: Point relative submodules at the upstream WinMerge organization (needed on forks)
      run: git config --global url."https://github.com/WinMerge/winmerge-manual".insteadOf "https://github.com/${{ github.repository_owner }}/winmerge-manual"

    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Cache
      uses: actions/cache@v5
      with:
        path: Build/WinMergeDownloadDeps
        key: WinMergeDownloadDeps

    - name: Build
      run: |
        .\DownloadDeps.cmd
        .\BuildAll.cmd x64 -ci

    - name: Upload zip
      uses: actions/upload-artifact@v4
      with:
        name: WinMerge-x64.zip
        path: Build/Releases/*.zip

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: WinMerge-x64-Setup-x64.exe
        path: Build/Releases/*.exe
